name: Build and check dist
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: build.mjs reads each content file's last commit date
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Copy static/ files as-is (IndexNow key etc.)
        run: if [ -d static ]; then cp -r static/. dist/; fi
      - run: node check-dist.mjs
