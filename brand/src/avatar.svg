      <stop offset="0.63" stop-color="#3FCA7D"/><stop offset="0.63" stop-color="#FF6B5E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#142036"/>
  <path d="M70 201H128l22-59 33 115 26-83 14 27H330" fill="none" stroke="url(#beat)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
